<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>fuel bench</title>
    <style>
      body {
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) 20px 40px;
        font: 22px/1.3 system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        min-height: 140px;
        margin-top: 24px;
        border: 0;
        border-radius: 20px;
        background: #0a7d32;
        color: #fff;
        font: 700 48px system-ui, -apple-system, sans-serif;
      }
      progress {
        width: 100%;
        height: 24px;
      }
      .row {
        margin: 18px 0;
      }
      .row b {
        display: block;
        font-size: 40px;
        line-height: 1.15;
      }
      .gate b {
        font-size: 56px;
      }
      .pass {
        color: #0a7d32;
      }
      .fail {
        color: #c8102e;
      }
      @media (prefers-color-scheme: dark) {
        .pass {
          color: #3ddc78;
        }
        .fail {
          color: #ff6b7f;
        }
      }
      .small {
        font-size: 18px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="bench"></div>
    <script type="module" src="./bench.tsx"></script>
  </body>
</html>
