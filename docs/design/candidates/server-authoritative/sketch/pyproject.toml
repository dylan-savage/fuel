[project]
name = "fuel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "zxing-cpp>=2.2",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pyright", "import-linter"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
typeCheckingMode = "strict"
include = ["fuel", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Boundary discipline, enforced by the build rather than by convention.
[tool.importlinter]
root_package = "fuel"

[[tool.importlinter.contracts]]
name = "Pure domain modules do no I/O"
type = "forbidden"
source_modules = ["fuel.model", "fuel.nutrition", "fuel.energy", "fuel.trend", "fuel.units"]
forbidden_modules = ["fuel.store", "fuel.service", "fuel.web", "fuel.sources", "sqlite3", "httpx", "anthropic", "fastapi"]

[[tool.importlinter.contracts]]
name = "Routes reach state only through the Fuel service"
type = "forbidden"
source_modules = ["fuel.web"]
forbidden_modules = ["fuel.store", "fuel.sources", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Adapters return domain types and never touch the store"
type = "forbidden"
source_modules = ["fuel.sources"]
forbidden_modules = ["fuel.store", "fuel.service", "fuel.web"]
